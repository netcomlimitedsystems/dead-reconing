{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <h2>Register Your Enterprise</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
</div>
{% endblock %}
